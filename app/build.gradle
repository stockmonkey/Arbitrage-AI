plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.arbitrage.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.arbitrage.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.5.0-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
